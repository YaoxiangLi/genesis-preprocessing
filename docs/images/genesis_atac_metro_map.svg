<path id="route-11" class="line" stroke="#4169b1" d="M 1060 690 L 1161 690 Q 1175 690 1175 676 L 1175 344 Q 1175 330 1161 330 L 1060 330"><title>Explicit TSS positions support diagnostic enrichment</title></path>
