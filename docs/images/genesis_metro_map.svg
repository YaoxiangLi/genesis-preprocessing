<path id="route-20" class="line" stroke="#438362" d="M 850 300 L 915 300 Q 930 300 930 315 L 930 675 Q 930 690 945 690 L 1080 690"><title>Full-read alignments feed coverage</title></path>
<path id="route-21" class="line" stroke="#438362" d="M 1080 690 L 1315 690 Q 1330 690 1330 675 L 1330 425"><title>RPKM coverage feeds quantification</title></path>
