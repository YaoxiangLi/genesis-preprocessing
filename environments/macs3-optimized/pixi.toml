[workspace]
name = "genesis-macs3-optimized"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]
version = "0.1.0"

[dependencies]
python = "3.12.*"
pip = "*"
c-compiler = "*"
zlib = ">=1.3,<2"
git = "*"
gzip = ">=1.13,<2"

[pypi-dependencies]
macs3 = { git = "https://github.com/macs3-project/MACS.git", rev = "22eb40f7b51f5b20b635614ca0b1759dc5398c5c" }
