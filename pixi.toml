[workspace]
name = "genesis"
version = "0.1.0"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[system-requirements]
libc = { family = "glibc", version = "2.17" }

[tool.custom_settings]
pixi_sub_projects = []
uv_sub_projects = ["genesis_tools"]

[dependencies]
nextflow = ">=25.10.4,<26"
uv = ">=0.11.15,<0.12"
shellcheck = ">=0.11,<0.12"
micromamba = ">=2.5,<2.6"

[tasks]
pipeline = "bash scripts/run-pipeline.sh"
install-all = "bash scripts/install-projects.sh"
checks = "bash scripts/check-projects.sh"
build-dockers = "bash scripts/build-dockers.sh"
validate-docker = "uv run --frozen --project genesis_tools python tests/verify_pipeline.py --docker"
