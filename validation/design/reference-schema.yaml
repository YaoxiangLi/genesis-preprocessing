{
  "type": "object",
  "additionalProperties": false,
  "properties": {
    "reference_id": {
      "type": "string",
      "minLength": 1
    },
    "aliases": {
      "type": "array",
      "items": {
        "type": "string",
        "minLength": 1
      },
      "uniqueItems": true
    },
    "species_scientific_name": {
      "type": "string",
      "minLength": 1
    },
    "ncbi_taxonomy_id": {
      "type": [
        "integer",
        "null"
      ],
      "minimum": 1
    },
    "accession_cultivar_ecotype": {
      "type": [
        "string",
        "null"
      ]
    },
    "assembly_name": {
      "type": "string",
      "minLength": 1
    },
    "assembly_version": {
      "type": "string",
      "minLength": 1
    },
    "assembly_accession": {
      "type": [
        "string",
        "null"
      ]
    },
    "assembly_provider": {
      "type": "string",
      "minLength": 1
    },
    "source_url": {
      "type": "string",
      "format": "uri"
    },
    "download_access_date": {
      "type": [
        "string",
        "null"
      ]
    },
    "fasta_basename": {
      "type": "string",
      "minLength": 1
    },
    "fasta_sha256": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "compressed_fasta_sha256": {
      "anyOf": [
        {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$"
        },
        {
          "type": "null"
        }
      ]
    },
    "masking": {
      "enum": [
        "softmasked",
        "hardmasked",
        "unmasked",
        "UNSPECIFIED"
      ]
    },
    "chromosome_naming_convention": {
      "type": "string",
      "minLength": 1
    },
    "chrom_sizes_sha256": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "annotation": {
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "source": {
          "type": [
            "string",
            "null"
          ]
        },
        "release": {
          "type": [
            "string",
            "null"
          ]
        },
        "basename": {
          "type": [
            "string",
            "null"
          ]
        },
        "sha256": {
          "anyOf": [
            {
              "type": "string",
              "pattern": "^[a-f0-9]{64}$"
            },
            {
              "type": "null"
            }
          ]
        },
        "tss_derivation_method": {
          "type": [
            "string",
            "null"
          ]
        }
      },
      "required": [
        "source",
        "release",
        "basename",
        "sha256",
        "tss_derivation_method"
      ]
    },
    "organellar_contigs": {
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "mitochondrial": {
          "type": "array",
          "items": {
            "type": "string",
            "minLength": 1
          },
          "uniqueItems": true
        },
        "plastid": {
          "type": "array",
          "items": {
            "type": "string",
            "minLength": 1
          },
          "uniqueItems": true
        }
      },
      "required": [
        "mitochondrial",
        "plastid"
      ]
    },
    "blacklist": {
      "anyOf": [
        {
          "type": "object",
          "additionalProperties": false,
          "properties": {
            "basename": {
              "type": "string",
              "minLength": 1
            },
            "version": {
              "type": "string",
              "minLength": 1
            },
            "sha256": {
              "type": "string",
              "pattern": "^[a-f0-9]{64}$"
            }
          },
          "required": [
            "basename",
            "version",
            "sha256"
          ]
        },
        {
          "type": "null"
        }
      ]
    },
    "cds_transcript_fastas": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "basename": {
            "type": "string",
            "minLength": 1
          },
          "source": {
            "type": "string",
            "minLength": 1
          },
          "release": {
            "type": "string",
            "minLength": 1
          },
          "sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          }
        },
        "required": [
          "basename",
          "source",
          "release",
          "sha256"
        ]
      }
    },
    "identity_status": {
      "enum": [
        "VERIFIED",
        "SYNTHETIC"
      ]
    },
    "chrom_sizes_basename": {
      "type": "string",
      "minLength": 1
    }
  },
  "required": [
    "reference_id",
    "aliases",
    "species_scientific_name",
    "ncbi_taxonomy_id",
    "accession_cultivar_ecotype",
    "assembly_name",
    "assembly_version",
    "assembly_accession",
    "assembly_provider",
    "source_url",
    "download_access_date",
    "fasta_basename",
    "fasta_sha256",
    "compressed_fasta_sha256",
    "masking",
    "chromosome_naming_convention",
    "chrom_sizes_sha256",
    "annotation",
    "organellar_contigs",
    "blacklist",
    "cds_transcript_fastas",
    "identity_status",
    "chrom_sizes_basename"
  ],
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:genesis:reference:1",
  "title": "Genesis reference bundle identity v1"
}
