{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:genesis:processing-provenance:1",
  "type": "object",
  "additionalProperties": false,
  "properties": {
    "execution_kind": {
      "enum": [
        "nextflow-run",
        "contract-validation"
      ]
    },
    "genesis_git_sha": {
      "type": "string",
      "pattern": "^[a-f0-9]{40}$"
    },
    "sample_sheet_sha256": {
      "anyOf": [
        {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$"
        },
        {
          "type": "null"
        }
      ]
    },
    "reference_registry_sha256": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "container_identities": {
      "type": "object",
      "minProperties": 1,
      "additionalProperties": {
        "type": "string",
        "pattern": "(^sha256:|@sha256:)[a-f0-9]{64}$"
      }
    },
    "parameters": {
      "type": "object"
    },
    "execution_timestamp": {
      "type": "string",
      "format": "date-time"
    },
    "nextflow_version": {
      "type": [
        "string",
        "null"
      ]
    },
    "task_versions": {
      "type": "object",
      "minProperties": 1,
      "additionalProperties": {
        "type": "string"
      }
    },
    "original_accessions_urls": {
      "type": "array",
      "items": {
        "type": "string"
      }
    }
  },
  "allOf": [
    {
      "if": {
        "properties": {
          "execution_kind": {
            "const": "nextflow-run"
          }
        }
      },
      "then": {
        "properties": {
          "sample_sheet_sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "nextflow_version": {
            "type": "string",
            "minLength": 1
          }
        }
      }
    }
  ],
  "required": [
    "execution_kind",
    "genesis_git_sha",
    "sample_sheet_sha256",
    "reference_registry_sha256",
    "container_identities",
    "parameters",
    "execution_timestamp",
    "nextflow_version",
    "task_versions",
    "original_accessions_urls"
  ]
}
